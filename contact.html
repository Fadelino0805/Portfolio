<main>
<h1 class="page-title">Contact Me</h1>
<section class="panel narrow">
<form id="contact-form" novalidate>
  <div class="field"><label for="name">Name</label><input type="text" id="name" name="name"><span class="error" id="name-error"></span></div>
  <div class="field"><label for="email">Email Address</label><input type="email" id="email" name="email"><span class="error" id="email-error"></span></div>
  <div class="field"><label for="phone">Phone Number</label><input type="tel" id="phone" name="phone"><span class="error" id="phone-error"></span></div>
  <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="error" id="message-error"></span></div>
  <button type="submit" class="btn">Send Message</button>
  <p id="form-success" class="success" role="status"></p>
</form></section>
</main>
