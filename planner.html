<!DOCTYPE html>
<html lang="en">

<header class="site-header">

  <nav id="main-nav" aria-label="Main navigation">

    </ul>
  </nav>
</header>
<main>
<h1 class="page-title">Academic Planner</h1>
<section class="panel planner">
  <form id="task-form" novalidate>
    <label for="task-input" class="sr-only">New task</label>
    <input type="text" id="task-input" placeholder="e.g. Finish HTML assignment" required>
    <input type="date" id="task-date" aria-label="Due date">
    <button type="submit" class="btn">Add Task</button>
  </form>
  <p id="task-error" class="error" role="alert"></p>
  <p id="task-count" class="muted"></p>
  <ul id="task-list"></ul>
</section>
</main>
<footer class="site-footer"><p>&copy; 2026 Abdulsalam Taiwo. Built with HTML, CSS and JavaScript.</p></footer>
